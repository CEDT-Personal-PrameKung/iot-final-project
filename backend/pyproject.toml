[project]
name = "smart-parking-backend"
version = "0.1.0"
description = "FastAPI backend for the Smart Parking IoT application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "email-validator>=2.0.0",
    "fastapi[standard]>=0.163.1",
    "pyjwt>=2.10.0",
    "pydantic-settings>=2.16.3",
    "psycopg[binary]>=3.2.0",
    "pwdlib[argon2]>=0.2.0",
    "sqlalchemy>=2.0.0",
    "scalar-doc>=0.1.8",
]
